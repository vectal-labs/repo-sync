name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CI policy tests
        run: node --test scripts/ci-plan.test.cjs
      - name: Select checks
        id: plan
        uses: actions/github-script@v7
        with:
          script: return await require('./scripts/ci-plan.cjs')({ github, context, core });
      - uses: actions/setup-go@v5
        if: steps.plan.outputs.result == 'true'
        with:
          go-version-file: go.mod
      - name: gofmt
        if: steps.plan.outputs.result == 'true'
        run: test -z "$(gofmt -l .)"
      - if: steps.plan.outputs.result == 'true'
        run: go vet ./...
      - if: steps.plan.outputs.result == 'true'
        run: go build ./...
      # ci-plan.cjs uses this step's success to distinguish full CI from docs-only CI.
      - if: steps.plan.outputs.result == 'true'
        run: go test -race -count=1 ./...
      - if: steps.plan.outputs.result == 'true'
        run: ruby scripts/test-cask.rb
        env:
          REPO_SYNC_HOMEBREW_TEST: "1"
      - uses: goreleaser/goreleaser-action@v6
        if: steps.plan.outputs.result == 'true'
        with:
          args: check --config .github/.goreleaser.yaml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean --config .github/.goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
