version: 2
project_name: repo-sync

builds:
  - main: .
    binary: repo-sync
    goos: [darwin]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=1 # FSEvents needs cgo
    flags: [-trimpath]
    ldflags: [-s -w]

archives:
  - formats: [tar.gz]

checksum:
  name_template: checksums.txt

brews:
  - repository:
      owner: vectal-labs
      name: homebrew-tap
    directory: Formula
    homepage: https://github.com/vectal-labs/repo-sync
    description: Keeps your Git repositories in sync automatically on macOS
    license: MIT
    install: bin.install "repo-sync"
    caveats: Run `repo-sync setup` to choose repositories and install the background service.
